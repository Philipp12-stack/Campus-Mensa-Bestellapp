<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CampusMensa – Vorbestellen</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#14263a;background:#f4f7fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:850px;margin:auto;padding:20px}header{background:#123b60;color:white;padding:26px 20px}header .wrap{padding:0}h1{margin:0 0 6px;font-size:30px}header p{margin:0;color:#dceaf5}.panel{background:white;border:1px solid #e2e8ef;border-radius:16px;padding:22px;margin-top:20px;box-shadow:0 5px 20px #102c4810}h2{font-size:20px;margin:0 0 16px}.days{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.day{border:1px solid #cbd5e1;background:white;border-radius:10px;padding:12px 3px;cursor:pointer;font-weight:650}.day.active{background:#123b60;color:white;border-color:#123b60}.day small{display:block;font-weight:400;margin-top:4px}.tabs{display:flex;gap:10px;margin-top:20px}.tab{flex:1;border:1px solid #b8c9d8;background:white;padding:13px;border-radius:12px;font-weight:700;cursor:pointer}.tab.active{background:#123b60;color:white}.weekly{display:grid;gap:18px}.week-day{border-top:1px solid #e2e8f0;padding-top:14px}.week-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.week-card{border:1px solid #e2e8f0;border-radius:12px;overflow:hidden;background:white}.week-card .detail{padding:12px}.week-card img,.meal img{width:100%;height:125px;object-fit:cover;background:#e9eff5}.meal img{width:100%;height:145px;object-fit:cover;border-radius:8px;order:-1}.week-card small{display:block;color:#64748b}.week-card strong{display:block;margin:5px 0}.week-card .price{display:block;margin-top:8px}.meals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.meal{display:flex;flex-direction:column;gap:10px;align-items:stretch;border:2px solid #e2e8f0;border-radius:12px;padding:16px;cursor:pointer}.meal:has(input:checked){border-color:#1976b8;background:#f0f8ff}.meal input{accent-color:#1976b8}.meal .desc{flex:1;min-width:0}.meal strong,.meal small{display:block}.meal small{color:#64748b;margin-bottom:4px}.price{font-weight:700}label.field{display:block;font-weight:650;margin:15px 0 6px}input[type=text],input[type=email],select{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:9px;font:inherit}.submit{width:100%;background:#12649a;color:white;border:0;border-radius:10px;padding:15px;font:inherit;font-weight:750;cursor:pointer;margin-top:18px}.submit:disabled{opacity:.5;cursor:not-allowed}.status{margin-top:14px;min-height:24px}.success{color:#12623d}.error{color:#a12424}.muted{color:#64748b}footer{text-align:center;color:#64748b;font-size:13px;padding:25px}@media(max-width:600px){.week-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.meals{grid-template-columns:repeat(3,minmax(180px,1fr));overflow-x:auto;padding-bottom:8px}.meal img{width:100%;height:110px}.tabs{gap:6px}.wrap{padding:12px}.panel{padding:15px}.day{font-size:13px}.meal{padding:10px}}
</style>
</head>
<body>
<header><div class="wrap"><h1>🍽️ CampusMensa</h1><p>Wähle dein Essen und hole es ohne langes Warten ab.</p></div></header>
<main class="wrap"><nav class="tabs" aria-label="Ansicht wählen"><button class="tab active" id="tab-order" type="button">Jetzt bestellen</button><button class="tab" id="tab-week" type="button">Wochenspeiseplan</button></nav><section class="panel" id="weekly-panel" hidden><h2>Speiseplan der Woche</h2><div id="weekly" class="weekly"></div></section><div id="order-view">
<section class="panel"><h2>1. Abholtag auswählen</h2><div class="days" id="days"></div></section>
<section class="panel"><h2>2. Gericht auswählen</h2><div class="meals" id="meals"><p class="muted">Speiseplan wird geladen …</p></div></section>
<section class="panel"><h2>3. Deine Bestelldaten</h2><form id="form"><label class="field" for="name">Vor- und Nachname</label><input id="name" type="text" maxlength="100" autocomplete="name" required minlength="2" placeholder="Max Mustermann"><label class="field" for="email">Hochschul-E-Mail</label><input id="email" type="email" maxlength="254" autocomplete="email" required placeholder="max@hochschule.de"><label class="field" for="time">Abholzeit (alle 15 Minuten)</label><select id="time" required></select><button class="submit" id="submit" type="submit">Verbindlich vorbestellen</button><div class="status" id="status" role="status" aria-live="polite"></div></form></section>
</div></main><footer>CampusMensa · Projektprototyp · Keine Online-Bezahlung</footer>
<script>
// HIER die bereitgestellte Google-Apps-Script-Web-App-URL einfügen:

const API_URL = 'https://script.google.com/macros/s/AKfycbyPXudoByG2j7UPT77LHDFWwx1sl2akeYO0RcawfTY1_94TlrsF-kSud_X1N-bl38k0Eg/exec';

const categories=['Fleisch','Vegetarisch','Vegan'];
let menu=[],selectedDate='',selectedCategory='';

function safeImage(url){try{const u=new URL(url);return u.protocol==='https:'?u.href:''}catch{return ''}}
function mealImage(m){const url=safeImage(m.imageUrl);if(!url)return null;const img=document.createElement('img');img.src=url;img.alt='Foto: '+m.dish;img.loading='lazy';img.referrerPolicy='no-referrer';img.onerror=()=>img.remove();return img}
function showView(weekly){$('weekly-panel').hidden=!weekly;$('order-view').hidden=weekly;$('tab-order').classList.toggle('active',!weekly);$('tab-week').classList.toggle('active',weekly);if(weekly)renderWeek()}
$('tab-order').onclick=()=>showView(false);$('tab-week').onclick=()=>showView(true);
function renderWeek(){const root=$('weekly');root.replaceChildren();const base=new Date(selectedDate+'T12:00:00');const monday=new Date(base);monday.setDate(base.getDate()-((base.getDay()+6)%7));for(let i=0;i<5;i++){const d=new Date(monday);d.setDate(monday.getDate()+i);const date=dateKey(d);const section=document.createElement('section');section.className='week-day';const title=document.createElement('h3');title.textContent=new Intl.DateTimeFormat('de-DE',{weekday:'long',day:'2-digit',month:'2-digit'}).format(d);section.appendChild(title);const grid=document.createElement('div');grid.className='week-grid';for(const category of categories){const m=menu.find(x=>x.date===date&&x.category===category);const card=document.createElement('div');card.className='week-card';if(m){const img=mealImage(m);if(img)card.appendChild(img)}const detail=document.createElement('div');detail.className='detail';const small=document.createElement('small');small.textContent=category;const strong=document.createElement('strong');strong.textContent=m?m.dish:'Noch nicht eingetragen';detail.append(small,strong);if(m){const price=document.createElement('span');price.className='price';price.textContent=Number(m.price).toLocaleString('de-DE',{style:'currency',currency:'EUR'});detail.appendChild(price)}card.appendChild(detail);grid.appendChild(card)}section.appendChild(grid);root.appendChild(section)}}
const $=id=>document.getElementById(id);
const dateKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const niceDate=d=>new Intl.DateTimeFormat('de-DE',{weekday:'short',day:'2-digit',month:'2-digit'}).format(d);
function availableDays(){const days=[];const d=new Date();d.setHours(12,0,0,0);while(days.length<5){if(d.getDay()>0&&d.getDay()<6)days.push(new Date(d));d.setDate(d.getDate()+1)}return days}
function renderDays(){const days=availableDays();if(!days.some(d=>dateKey(d)===selectedDate))selectedDate=dateKey(days[0]);$('days').replaceChildren();for(const d of days){const key=dateKey(d);const b=document.createElement('button');b.type='button';b.className='day'+(key===selectedDate?' active':'');b.textContent=niceDate(d);b.addEventListener('click',()=>{selectedDate=key;selectedCategory='';renderDays();renderMeals();renderTimes();renderWeek()});$('days').appendChild(b)}}
function renderMeals(){const el=$('meals');el.replaceChildren();const list=menu.filter(m=>m.date===selectedDate);if(!list.length){const p=document.createElement('p');p.className='muted';p.textContent='Für diesen Tag ist noch kein Speiseplan hinterlegt.';el.appendChild(p);return}for(const category of categories){const m=list.find(x=>x.category===category);if(!m)continue;const label=document.createElement('label');label.className='meal';const radio=document.createElement('input');radio.type='radio';radio.name='dish';radio.value=category;radio.checked=selectedCategory===category;radio.addEventListener('change',()=>{selectedCategory=category});const desc=document.createElement('span');desc.className='desc';const small=document.createElement('small');small.textContent=category;const strong=document.createElement('strong');strong.textContent=m.dish;desc.append(small,strong);const price=document.createElement('span');price.className='price';price.textContent=Number(m.price).toLocaleString('de-DE',{style:'currency',currency:'EUR'});label.append(radio);const img=mealImage(m);if(img)label.append(img);label.append(desc,price);el.appendChild(label)}}
function renderTimes(){const select=$('time');select.replaceChildren();const now=new Date();for(let m=660;m<=840;m+=15){const time=`${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;if(selectedDate===dateKey(now) && time<=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`)continue;const opt=document.createElement('option');opt.value=time;opt.textContent=time+' Uhr';select.appendChild(opt)}}

async function loadMenu() {
  const days = availableDays();
  const results = [];

 $('meals').textContent = 'Verbindung zur Mensa wird geprüft …';

  try {
    for (const day of days) {
      const date = dateKey(day);
     const res = await fetch(API_URL + '?datum=' + encodeURIComponent(date), {redirect: 'follow'});

      if (!res.ok) {
        throw new Error('HTTP-Fehler ' + res.status);
      }

      const data = await res.json();

      if (!data.success) {
        throw new Error(data.error || 'Ladefehler');
      }

      for (const gericht of data.gerichte) {
        results.push({
          date: date,
          category: gericht.kategorie,
          dish: gericht.gericht,
          price: gericht.preis,
          imageUrl: gericht.bildURL || ''
        });
      }
    }

    menu = results;
    renderMeals();
    renderWeek();

  } catch (e) {
    $('meals').textContent =
      'Speiseplan konnte nicht geladen werden: ' + e.message;
  }
}

$('form').addEventListener('submit',async e=>{e.preventDefault();const status=$('status');status.className='status';status.textContent='';if(!selectedCategory){status.textContent='Bitte wähle ein Gericht.';status.classList.add('error');return}if(!$('time').value){status.textContent='Keine gültige Abholzeit mehr verfügbar.';status.classList.add('error');return}const btn=$('submit');btn.disabled=true;btn.textContent='Bestellung wird gesendet …';try{const payload={action:'order',date:selectedDate,category:selectedCategory,time:$('time').value,name:$('name').value.trim(),email:$('email').value.trim()};/* Apps Script antwortet bei Cross-Origin-POST häufig ohne lesbare CORS-Freigabe. text/plain vermeidet Preflight, die Antwort bleibt ggf. blockiert. */await fetch(API_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});status.textContent='Bestellung gesendet. Bitte prüfe die Bestellungen-Tabelle, ob sie gespeichert wurde. Eine Bestätigung kann diese Version technisch nicht sicher auslesen.';status.classList.add('success')}catch(err){status.textContent='Senden fehlgeschlagen. Bitte prüfe deine Verbindung und die Tabelle, bevor du erneut bestellst.';status.classList.add('error')}finally{btn.disabled=false;btn.textContent='Verbindlich vorbestellen'}});
ralert('JavaScript startet');renderDays();renderTimes();loadMenu();
</script>
</body></html>
